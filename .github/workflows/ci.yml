name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Postgres integration tests (embedded Postgres)
        run: npx vitest run server/vercel.test.ts
        env:
          DN_PG_TEST: '1'
      - name: Builds (web, on-device, Vercel bundle)
        run: |
          npm run build
          npm run build:app
          npm run build:vercel
